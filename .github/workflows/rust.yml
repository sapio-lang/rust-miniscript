name: Continuous integration

on:
  push:
    branches: [master, inscribor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `unstable` enables nightly-only benchmark tests.
  STABLE_FEATURES: compiler,use-serde,use-schemars,rand,trace

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo test --locked --features "$STABLE_FEATURES"
      - name: Run examples
        run: |
          for example in htlc parse sign_multisig verify_tx psbt xpub_descriptors; do
            cargo run --locked --features "$STABLE_FEATURES" --example "$example"
          done

  features:
    name: Feature coverage and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo test --locked --no-default-features
      - name: Test each optional feature separately
        run: |
          for feature in compiler use-serde use-schemars rand; do
            cargo test --locked --no-default-features --features "$feature"
          done
      - run: cargo clippy --locked --all-targets --features "$STABLE_FEATURES"
      - run: cargo doc --locked --no-deps --features "$STABLE_FEATURES"

  wasm:
    name: WASM library
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Check the Sapio guest feature set
        run: >-
          cargo check --locked --lib --target wasm32-unknown-unknown
          --no-default-features --features compiler,use-serde,use-schemars
